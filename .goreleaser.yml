version: 2

builds:
  - main: .
    binary: vigil
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - format: tar.gz

brews:
  - repository:
      owner: joshuazd
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/joshuazd/vigil"
    description: "TUI dashboard for tmux sessions"
    license: "GPL-3.0"
    install: |
      bin.install "vigil"
    test: |
      assert_match "vigil", shell_output("#{bin}/vigil --help")
